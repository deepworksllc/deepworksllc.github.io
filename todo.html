<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Launch checklist — 1on1</title>
<meta name="description" content="Shared launch to-do list for the 1on1 team." />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: #0F1115; background: #FFFFFF; line-height: 1.6; font-size: 16px;
  }
  .nav {
    max-width: 1040px; margin: 0 auto; padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; }
  .brand .one { color: #0021F3; }
  .brand .on { color: #F64F00; }
  .nav a { color: #0F1115; text-decoration: none; font-size: 15px; margin-left: 20px; }
  .nav a:hover { color: #0021F3; }
  .nav a[aria-current="page"] { color: #0021F3; font-weight: 600; }
  .page { max-width: 680px; margin: 0 auto; padding: 32px 24px 96px; }
  h1 { font-size: 38px; letter-spacing: -1px; margin: 16px 0 8px; }
  .sub { color: #5B6472; margin: 0 0 28px; }
  .addrow { display: flex; gap: 10px; margin-bottom: 20px; }
  .addrow input[type="text"] {
    flex: 1; border: 1px solid #D5D9E0; border-radius: 10px; padding: 12px 14px;
    font-size: 15px; font-family: inherit;
  }
  .addrow input[type="text"]:focus { outline: 2px solid #0021F3; border-color: transparent; }
  .addrow button {
    border: 0; background: #0A0C10; color: #fff; border-radius: 10px; padding: 12px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .addrow button:hover { background: #0021F3; }
  .filters { display: flex; gap: 6px; margin-bottom: 16px; }
  .filters button {
    border: 1px solid #D5D9E0; background: #fff; border-radius: 999px; padding: 6px 14px;
    font-size: 13px; cursor: pointer; color: #3D4351; font-family: inherit;
  }
  .filters button.active { background: #0021F3; border-color: #0021F3; color: #fff; }
  ul#list { list-style: none; margin: 0; padding: 0; }
  #list li {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid #ECECEF; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  #list li input[type="checkbox"] { width: 18px; height: 18px; accent-color: #0021F3; cursor: pointer; }
  #list li .text { flex: 1; font-size: 15px; word-break: break-word; }
  #list li.done .text { text-decoration: line-through; color: #8B93A2; }
  #list li .del {
    border: 0; background: none; color: #F64F00; font-size: 17px; cursor: pointer;
    padding: 4px 8px; border-radius: 8px; line-height: 1;
  }
  #list li .del:hover { background: #FFF1EA; }
  .meta { color: #8B93A2; font-size: 13px; margin-top: 18px; }
  .empty { color: #8B93A2; text-align: center; padding: 32px 0; }
  footer {
    border-top: 1px solid #ECECEF; margin-top: 48px; padding: 32px 24px 48px;
    text-align: center; color: #8B93A2; font-size: 14px;
  }
  footer a { color: #0021F3; text-decoration: none; margin: 0 10px; }
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/"><span class="one">1</span><span class="on">on</span><span class="one">1</span></a>
  <div>
    <a href="/how-it-works.html">How it works</a>
    <a href="/for-hosts.html">For hosts</a>
    <a href="/support.html">Support</a>
    <a href="/todo.html" aria-current="page">To-do</a>
    <a href="/tasks.html">Launch tasks</a>
    <a href="/nice-to-have.html">After launch</a>
    <a href="/legal/">Legal</a>
  </div>
</nav>

<div class="page">
  <h1>Launch checklist</h1>
  <p class="sub">Shared to-do list for getting 1on1 out the door. Saved in this browser.</p>

  <form class="addrow" id="addForm">
    <input type="text" id="newItem" placeholder="Add a task… e.g. Rotate Stripe keys" autocomplete="off" />
    <button type="submit">Add</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="open">Open</button>
    <button data-filter="done">Done</button>
    <button data-filter="clear-done" style="margin-left:auto; border-color:#F64F00; color:#F64F00;">Clear done</button>
  </div>

  <ul id="list"></ul>
  <p class="meta" id="meta"></p>
</div>

<footer>
  <p>
    <a href="/legal/terms-of-service.html">Terms of Service</a> ·
    <a href="/legal/privacy-policy.html">Privacy Policy</a> ·
    <a href="/support.html">Support</a>
  </p>
  <p>© 2026 DeepWorks LLC · support@1on1.app</p>
</footer>

<script>
(function () {
  var KEY = 'oneon1-launch-todos';
  var list = document.getElementById('list');
  var meta = document.getElementById('meta');
  var form = document.getElementById('addForm');
  var input = document.getElementById('newItem');
  var filter = 'all';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

  function render() {
    var items = load();
    list.innerHTML = '';
    var visible = items.filter(function (it) {
      if (filter === 'open') return !it.done;
      if (filter === 'done') return it.done;
      return true;
    });

    if (!visible.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.style.border = 'none';
      li.textContent = items.length ? 'Nothing ' + filter + ' right now.' : 'No tasks yet — add the first one above.';
      list.appendChild(li);
    }

    visible.forEach(function (it) {
      var li = document.createElement('li');
      if (it.done) li.className = 'done';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = it.done;
      box.addEventListener('change', function () {
        var all = load();
        for (var i = 0; i < all.length; i++) {
          if (all[i].id === it.id) all[i].done = box.checked;
        }
        save(all);
        render();
      });

      var text = document.createElement('span');
      text.className = 'text';
      text.textContent = it.text;

      var del = document.createElement('button');
      del.className = 'del';
      del.title = 'Delete';
      del.setAttribute('aria-label', 'Delete: ' + it.text);
      del.textContent = '✕';
      del.addEventListener('click', function () {
        save(load().filter(function (x) { return x.id !== it.id; }));
        render();
      });

      li.appendChild(box);
      li.appendChild(text);
      li.appendChild(del);
      list.appendChild(li);
    });

    var open = items.filter(function (x) { return !x.done; }).length;
    var done = items.length - open;
    meta.textContent = items.length
      ? open + ' open · ' + done + ' done'
      : 'Tip: these tasks are stored per browser — share the page, not the state.';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var items = load();
    items.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text: text, done: false });
    save(items);
    input.value = '';
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.filter === 'clear-done') {
        save(load().filter(function (x) { return !x.done; }));
        render();
        return;
      }
      filter = btn.dataset.filter;
      Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
