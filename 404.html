<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · DEEP Works</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; color: #0f172a; background: #fff; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 110px 24px; text-align: center; }
  .code { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0d9488; }
  h1 { font-size: 40px; letter-spacing: -0.03em; margin: 10px 0 12px; }
  p { color: #475569; }
  .links { margin-top: 26px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 13px 28px; border-radius: 999px; font-weight: 700; text-decoration: none; font-size: 15px; background: #0f172a; color: #fff; }
  .btn:hover { background: #1e293b; }
  .ghost { background: #fff; color: #0f172a; border: 2px solid #cbd5e1; }
  .ghost:hover { border-color: #0d9488; color: #0d9488; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="code">404 · DEEP Works</span>
    <h1>Page not found</h1>
    <p>The page may have been moved or no longer exists.</p>
    <div class="links">
      <a class="btn" href="/">DEEP Works home</a>
    </div>
  </div>
</body>
</html>
